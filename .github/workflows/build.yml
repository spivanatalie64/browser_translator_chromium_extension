name: Build extension

# Whenever anything gets pushed through git, this builds the loadable zip.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: bash release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eilatan-lingo
          path: releases/*.zip

      # Tag pushes (e.g. v1.1.0) get a GitHub Release with the zip attached.
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
          generate_release_notes: true
